<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRAND | Minimalist Luxury</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #FFFFFF;
            --text: #1A1A1A;
            --accent: #007BFF;
            --gray: #F4F4F4;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }

        /* Navigation */
        nav { position: sticky; top: 0; background: rgba(255,255,255,0.95); padding: 2rem 5%; display: flex; justify-content: space-between; align-items: center; z-index: 1000; border-bottom: 1px solid #eee; }
        .logo { font-weight: 700; font-size: 1.5rem; letter-spacing: -1px; }
        .nav-links { display: flex; gap: 2rem; align-items: center; }

        /* Hero */
        .hero { display: grid; grid-template-columns: 1fr 1fr; padding: 5rem 5%; align-items: center; gap: 4rem; }
        .hero-content h1 { font-size: 3.5rem; margin-bottom: 1.5rem; line-height: 1.1; }
        .hero-img { width: 100%; aspect-ratio: 1/1; background: #000; }
        .btn { background: var(--accent); color: white; padding: 1rem 2rem; border: none; cursor: pointer; font-weight: 600; transition: transform 0.2s; }
        .btn:hover { transform: translateY(-3px); }

        /* Trust Strip */
        .trust-strip { display: flex; justify-content: space-between; padding: 2rem 5%; border-top: 1px solid #eee; border-bottom: 1px solid #eee; gap: 1rem; }
        .logo-placeholder { width: 100px; height: 30px; background: #ddd; }

        /* Product Grid */
        .collection { padding: 5rem 5%; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2rem; margin-top: 3rem; }
        .card { padding: 1rem; transition: box-shadow 0.3s; border: 1px solid #eee; }
        .card:hover { box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .prod-img { width: 100%; aspect-ratio: 1/1; background: #000; margin-bottom: 1rem; }
        .card h3 { margin-bottom: 0.5rem; }

        /* Review */
        .review { text-align: center; padding: 5rem 20%; background: var(--gray); }
        .stars { color: var(--accent); margin-bottom: 1rem; }

        /* Footer */
        footer { padding: 3rem 5%; text-align: center; font-size: 0.9rem; color: #666; }
        
        @media (max-width: 768px) {
            .hero { grid-template-columns: 1fr; text-align: center; }
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">BRAND</div>
        <div class="nav-links">
            <a href="#">Shop</a>
            <div id="cart-count">Cart (0)</div>
        </div>
    </nav>

    <header class="hero">
        <div class="hero-content">
            <h1>The Future of Lifestyle is Here</h1>
            <p>Experience quality engineered for simplicity. Crafted for those who demand more.</p>
            <br>
            <button class="btn">Shop Now</button>
        </div>
        <div class="hero-img"></div>
    </header>

    <section class="trust-strip">
        <div class="logo-placeholder"></div>
        <div class="logo-placeholder"></div>
        <div class="logo-placeholder"></div>
        <div class="logo-placeholder"></div>
        <div class="logo-placeholder"></div>
    </section>

    <section class="collection">
        <h2>Our Signature Collection</h2>
        <div class="grid" id="product-grid">
            <script>
                for(let i=1; i<=6; i++) {
                    document.write(`
                        <div class="card">
                            <div class="prod-img"></div>
                            <h3>Product ${i}</h3>
                            <p>$49.99</p>
                            <br>
                            <button class="btn add-btn" style="width:100%">Add to Cart</button>
                        </div>
                    `);
                }
            </script>
        </div>
    </section>

    <section class="review">
        <div class="stars">★★★★★</div>
        <p>"This changed my daily routine completely. Can't imagine going back."</p>
        <p><strong>— Jane D.</strong></p>
    </section>

    <footer>
        <p>&copy; 2026 BRAND. | <a href="#">FAQ</a> | <a href="#">Shipping</a> | <a href="#">Contact</a></p>
    </footer>

    <script>
        let count = 0;
        const cartDisplay = document.getElementById('cart-count');
        
        document.querySelectorAll('.add-btn').forEach(button => {
            button.addEventListener('click', () => {
                count++;
                cartDisplay.innerText = `Cart (${count})`;
                button.innerText = "Added!";
                setTimeout(() => button.innerText = "Add to Cart", 2000);
            });
        });
    </script>
</body>
</html>
