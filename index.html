<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRAND | Functional Prototype</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #FFFFFF; --text: #1A1A1A; --accent: #007BFF; --overlay: rgba(0,0,0,0.5); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); overflow-x: hidden; }

        /* Navigation & Cart Trigger */
        nav { position: sticky; top: 0; background: #fff; padding: 2rem 5%; display: flex; justify-content: space-between; align-items: center; z-index: 100; border-bottom: 1px solid #eee; }
        .cart-trigger { cursor: pointer; font-weight: 700; }

        /* Drawer & Modals */
        .overlay { position: fixed; top: 0; right: -100%; width: 30%; height: 100%; background: white; box-shadow: -5px 0 15px rgba(0,0,0,0.1); transition: 0.3s; padding: 2rem; z-index: 1000; overflow-y: auto; }
        @media (max-width: 768px) { .overlay { width: 80%; } }
        .overlay.active { right: 0; }
        
        .modal-backdrop { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--overlay); display: none; justify-content: center; align-items: center; z-index: 2000; }
        .modal { background: white; padding: 2rem; width: 90%; max-width: 400px; border-radius: 8px; }

        /* Toast */
        #toast { position: fixed; top: 20px; right: 20px; background: #333; color: white; padding: 1rem; border-radius: 4px; display: none; z-index: 3000; }

        /* Grid */
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2rem; padding: 5rem 5%; }
        .prod-img { width: 100%; aspect-ratio: 1/1; background: #000; margin-bottom: 1rem; }
        .btn { background: var(--accent); color: white; padding: 0.8rem 1.5rem; border: none; cursor: pointer; width: 100%; }
        
        input { display: block; width: 100%; margin: 10px 0; padding: 10px; border: 1px solid #ccc; }
    </style>
</head>
<body>

    <nav>
        <div class="logo">BRAND</div>
        <div class="cart-trigger" onclick="toggleDrawer()">Cart (<span id="count">0</span>)</div>
    </nav>

    <div class="grid" id="shop"></div>

    <div class="overlay" id="drawer">
        <h3>Your Cart</h3>
        <div id="cart-items" style="margin: 2rem 0;"></div>
        <p><strong>Total: $<span id="total">0.00</span></strong></p>
        <button class="btn" style="margin-top: 1rem;" onclick="openCheckout()">Checkout</button>
    </div>

    <div class="modal-backdrop" id="checkout-modal">
        <div class="modal" id="modal-content">
            <h3>Checkout</h3>
            <input type="text" placeholder="Name" required>
            <input type="email" placeholder="Email" required>
            <input type="text" placeholder="Shipping Address" required>
            <button class="btn" onclick="completePurchase()">Complete Purchase</button>
        </div>
    </div>

    <div id="toast">Added to cart!</div>

    <script>
        let cart = [];
        const products = [
            {id: 1, name: "Product 1", price: 49.99},
            {id: 2, name: "Product 2", price: 59.99},
            {id: 3, name: "Product 3", price: 39.99},
            {id: 4, name: "Product 4", price: 89.99},
            {id: 5, name: "Product 5", price: 29.99},
            {id: 6, name: "Product 6", price: 99.99}
        ];

        // Init Store
        const shop = document.getElementById('shop');
        products.forEach(p => {
            shop.innerHTML += `<div><div class="prod-img"></div><h3>${p.name}</h3><p>$${p.price}</p><button class="btn" onclick="addToCart(${p.id})">Add to Cart</button></div>`;
        });

        function addToCart(id) {
            const item = products.find(p => p.id === id);
            cart.push(item);
            updateCart();
            showToast();
        }

        function updateCart() {
            document.getElementById('count').innerText = cart.length;
            const container = document.getElementById('cart-items');
            container.innerHTML = cart.map(i => `<p>${i.name} - $${i.price}</p>`).join('');
            document.getElementById('total').innerText = cart.reduce((sum, i) => sum + i.price, 0).toFixed(2);
        }

        function toggleDrawer() { document.getElementById('drawer').classList.toggle('active'); }
        
        function showToast() {
            const t = document.getElementById('toast');
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 2000);
        }

        function openCheckout() { document.getElementById('checkout-modal').style.display = 'flex'; }

        function completePurchase() {
            const m = document.getElementById('modal-content');
            m.innerHTML = `<div style="text-align:center"><h3>Processing...</h3><div style="animation: pulse 1s infinite">...</div></div>`;
            setTimeout(() => {
                m.innerHTML = `<h3>Thank you for your order! (Demo Only)</h3><button class="btn" onclick="location.reload()">Close</button>`;
            }, 2000);
        }
    </script>
</body>
</html>
