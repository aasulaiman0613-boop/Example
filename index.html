<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUXE | Minimalist Storefront</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .bento-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 1.5rem; }
        .cart-drawer { transition: transform 0.3s ease-in-out; }
    </style>
</head>
<body class="bg-white text-black">

    <nav class="sticky top-0 z-40 bg-white/80 backdrop-blur-md border-b border-gray-100 px-6 py-4 flex justify-between items-center">
        <h1 class="text-xl font-bold tracking-tighter">LUXE.</h1>
        <button onclick="toggleCart()" class="text-sm font-semibold hover:text-blue-600 transition">Cart (<span id="cart-count">0</span>)</button>
    </nav>

    <section class="px-6 py-20 text-center">
        <h2 class="text-6xl font-light mb-6">Designed for the future.</h2>
        <button class="bg-black text-white px-8 py-3 rounded-full hover:bg-blue-600 transition">Shop Collection</button>
    </section>

    <div class="flex justify-around py-8 border-y border-gray-100 text-xs text-gray-500 uppercase tracking-widest">
        <span>Free Shipping</span><span>Secure Checkout</span><span>2-Year Warranty</span>
    </div>

    <main id="product-grid" class="p-6 bento-grid max-w-7xl mx-auto"></main>

    <div id="cart-drawer" class="fixed top-0 right-0 h-full w-full md:w-96 bg-white shadow-2xl z-50 transform translate-x-full cart-drawer p-6 overflow-y-auto">
        <div class="flex justify-between items-center mb-8">
            <h3 class="text-xl font-bold">Your Bag</h3>
            <button onclick="toggleCart()" class="text-gray-400">Close</button>
        </div>
        <div id="cart-items" class="space-y-4"></div>
        <div class="mt-8 border-t pt-4">
            <div class="flex justify-between mb-4"><span>Subtotal</span><span id="subtotal">$0.00</span></div>
            <button onclick="openCheckout()" class="w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-black transition">Checkout</button>
        </div>
    </div>

    <div id="checkout-modal" class="hidden fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-2xl w-full max-w-md" id="checkout-content">
            </div>
    </div>

    <script>
        // 1. DATA LAYER
        const products = [
            { id: 1, name: "Ion Watch", price: 299, desc: "Precision engineering." },
            { id: 2, name: "Sonic Buds", price: 199, desc: "Immersive sound profile." },
            { id: 3, name: "Air Sleeve", price: 89, desc: "Minimalist protection." },
            { id: 4, name: "Flux Charger", price: 49, desc: "Lightning fast power." },
            { id: 5, name: "Core Stand", price: 129, desc: "Architectural stability." },
            { id: 6, name: "Slate Mouse", price: 159, desc: "Ergonomic perfection." }
        ];

        let cart = [];

        // 2. RENDERING LOGIC
        function renderProducts() {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = products.map(p => `
                <div class="p-8 border border-gray-100 rounded-3xl hover:border-black transition-all group">
                    <div class="h-48 bg-gray-50 rounded-2xl mb-6 group-hover:bg-blue-50 transition"></div>
                    <h3 class="font-bold text-lg">${p.name}</h3>
                    <p class="text-gray-500 text-sm mb-4">${p.desc}</p>
                    <button onclick="addToCart(${p.id})" class="text-blue-600 font-semibold hover:underline">Add to Cart</button>
                </div>
            `).join('');
        }

        // 3. CART MANAGEMENT
        function addToCart(id) {
            const product = products.find(p => p.id === id);
            cart.push({...product, qty: 1});
            updateCartUI();
            alert(`${product.name} added to cart.`);
        }

        function updateCartUI() {
            const cartItems = document.getElementById('cart-items');
            const subtotalEl = document.getElementById('subtotal');
            document.getElementById('cart-count').innerText = cart.length;
            
            cartItems.innerHTML = cart.map((item, index) => `
                <div class="flex justify-between items-center">
                    <span>${item.name}</span>
                    <span>$${item.price}</span>
                </div>
            `).join('');
            
            const total = cart.reduce((sum, item) => sum + item.price, 0);
            subtotalEl.innerText = `$${total.toFixed(2)}`;
        }

        function toggleCart() {
            const drawer = document.getElementById('cart-drawer');
            drawer.classList.toggle('translate-x-full');
        }

        // 4. CHECKOUT FLOW
        function openCheckout() {
            document.getElementById('checkout-modal').classList.remove('hidden');
            document.getElementById('checkout-content').innerHTML = `
                <h3 class="text-2xl font-bold mb-4">Shipping Details</h3>
                <input type="text" placeholder="Full Name" class="w-full border p-3 mb-2 rounded">
                <input type="email" placeholder="Email Address" class="w-full border p-3 mb-4 rounded">
                <button onclick="finalizeCheckout()" class="w-full bg-black text-white py-3 rounded">Confirm</button>
            `;
        }

        function finalizeCheckout() {
            document.getElementById('checkout-content').innerHTML = `
                <h3 class="text-2xl font-bold mb-4">Success!</h3>
                <p>Order #${Math.floor(Math.random()*100000)} placed successfully.</p>
                <button onclick="location.reload()" class="mt-4 text-blue-600">Return Home</button>
            `;
        }

        renderProducts();
    </script>
</body>
</html>
